[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "../.tools/solc-0.8.26.exe"
auto_detect_solc = false
auto_detect_remappings = false
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = []
remappings = [
 "forge-std/=lib/forge-std/src/",
 "continuous-clearing-auction/=lib/cca/src/",
 "cca/=lib/cca/",
 "liquidity-launcher/=lib/liquidity-launcher/",
 "v4-core/=lib/v4-core/",
 "@uniswap/v4-core/=lib/v4-core/",
 "v4-periphery/=lib/v4-periphery/",
 "@uniswap/v4-periphery/=lib/v4-periphery/",
 "@uniswap/blocknumberish/=lib/blocknumberish/",
 "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
 "openzeppelin-contracts/=lib/openzeppelin-contracts/",
 "solady/=lib/solady/src/",
 "permit2/=lib/permit2/",
 "solmate/=lib/solmate/",
 "lib/v4-core/:@openzeppelin/contracts/=lib/v4-core-openzeppelin-contracts/contracts/",
 "lib/permit2/:@openzeppelin/contracts/=lib/permit2-openzeppelin-contracts/contracts/",
 "lib/permit2/:solmate/=lib/permit2-solmate/",
 "blocknumberish/=lib/blocknumberish/",
 "lib/cca/:@openzeppelin/contracts/=lib/cca-openzeppelin-contracts/contracts/",
 "lib/cca-liquidity-launcher/:@openzeppelin/contracts/=lib/cca-openzeppelin-contracts/contracts/",
 "lib/cca-v4-periphery/:@openzeppelin/contracts/=lib/cca-openzeppelin-contracts/contracts/",
 "lib/cca/:solady/=lib/cca-solady/src/",
 "lib/cca/:v4-periphery/=lib/cca-v4-periphery/",
 "lib/cca/:liquidity-launcher/=lib/cca-liquidity-launcher/"
]
[profile.default.fuzz]
runs = 256
[profile.default.invariant]
runs = 128
depth = 64
